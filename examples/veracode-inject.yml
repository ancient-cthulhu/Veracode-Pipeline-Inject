# Example config for veracode_inject.py (--config veracode-inject.yml).
# Command-line flags override these values.
defaults:
  branch: veracode/integration
  pr_gate_policy: Veracode Recommended Very High
  branch_fail_on_severity: ""          # empty = any flaw fails branch pushes
  runner: ubuntu-latest
  sast: auto                           # auto | on | off
  pipeline: true                       # Pipeline Scan: branch pushes + PRs
  policy: true                         # Policy Scan: pushes to the default branch
  sandboxes: false                     # Sandbox scan: PRs into the default branch
  sca: auto                            # auto | on | off
  iac: "on"                            # on | artifacts | off (quote it: YAML reads bare on as true)
  windows_runner: windows-latest       # SCA runner for Windows-only .NET/C++ builds; "off" disables
  sca_blocking: false
  iac_blocking: false
  retention_days: 3

# Per-repo overrides: glob on org/repo, later matches win.
repos:
  "my-org/payments-*":
    workflow: build.yml
    build_job: package
    artifact_path:
      - "services/*/target/*.jar"
      - "!**/*-tests.jar"
  "my-org/legacy-desktop":
    runner: windows-latest             # Veracode jobs need bash, python3 and git
    build_job: build
    build_step: Publish
  "my-org/regulated-*":
    pipeline: false
    sandboxes: true                    # sandbox per PR source branch + policy scan on merge
  "my-org/docs-*":
    sast: "off"
    sca: "off"
